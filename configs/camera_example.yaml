# Camera config for `python -m ahjia demo` (format: DESIGN.md "Camera config").
# Zone polygons are normalized (x and y in 0..1, origin at the top-left).
# Face ID is simulated: the person in view gets the identity below.
camera: living
start_clock: "14:05:00"
elder_alone: true
identity: elder
zones:
  sofa: [[0.05, 0.55], [0.35, 0.55], [0.35, 0.95], [0.05, 0.95]]
  bed: [[0.60, 0.50], [0.95, 0.50], [0.95, 0.90], [0.60, 0.90]]
default_zone: floor   # ground outside every polygon
