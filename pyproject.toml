[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ahjia-care-router"
version = "0.1.0"
description = "AhJia Care Router: Stage I laptop prototype (Hailo-10H timing and power are simulated)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
vision = ["ultralytics>=8.3", "opencv-python-headless>=4.8"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
ahjia = "ahjia.cli:main"

[tool.setuptools.packages.find]
include = ["ahjia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "unit: fast tests with no model weights or video",
    "integration: needs model weights or a video file (skipped by default)",
]
