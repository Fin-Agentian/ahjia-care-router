# SYNTHETIC 24 h day of one elder living alone. Hand-written to be plausible,
# not recorded. Used for KPI 1 (24 h average power) and as a fair, mixed load:
# night bathroom trips, meals, two TV blocks (a TV drama shouts "help" once),
# a nap on the sofa, a caregiver visit, a family visit, one fall that the elder
# clears herself, and a question to AhJia at night.
# The events were written before any strategy was run; the fall happens in the
# afternoon with the TV off. A TV voice saying "help" is treated as real (the
# system cannot tell a TV from the elder yet), so the TV "help" raises A1+A4+A5;
# the elder says "I'm OK" and stands up for a moment, which clears it (P:249).
#
# Cameras: bedroom (zones bed, bedside), living (sofa, living, kitchen),
# hallway (hallway, bathroom_door; the bathroom has no camera), front_door.
# t may be a number of seconds or a wall-clock "HH:MM:SS" (start_clock + t).
# "repeat" expands one event every every_s seconds until "until".
